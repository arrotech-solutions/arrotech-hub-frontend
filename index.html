<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#7C3AED" />
  <meta name="description"
    content="Arrotech Hub — Unified inbox, calendar, tasks, and workflow automation. Connect Slack, Gmail, M-Pesa, and 50+ apps in one workspace." />

  <!-- Security -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://hub.arrotechsolutions.com" />

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />

  <!-- PWA -->
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json" />

  <title>Arrotech Hub</title>

  <!-- Open Graph for Site Name in Google Search -->
  <meta property="og:site_name" content="Arrotech Hub" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://hub.arrotechsolutions.com" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://hub.arrotechsolutions.com/#website",
          "url": "https://hub.arrotechsolutions.com/",
          "name": "Arrotech Hub"
        },
        {
          "@type": "Organization",
          "@id": "https://arrotechsolutions.com/#organization",
          "name": "Arrotech Solutions",
          "url": "https://arrotechsolutions.com",
          "logo": "https://hub.arrotechsolutions.com/favicon.png",
          "sameAs": [
            "https://twitter.com/arrotech",
            "https://linkedin.com/company/arrotech-solutions"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+254-700-000-000",
            "contactType": "customer service"
          }
        }
      ]
    }
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
  <!-- Facebook SDK for WhatsApp Embedded Signup -->
  <script>
    window.fbAsyncInit = function() {
      var appId = document.querySelector('meta[name="fb-app-id"]');
      if (appId && appId.content) {
        FB.init({
          appId: appId.content,
          cookie: true,
          xfbml: false,
          version: 'v22.0'
        });
      }
    };
  </script>
  <meta name="fb-app-id" content="%VITE_FACEBOOK_APP_ID%" />
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
</body>
</html>
